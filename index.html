<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Méninges</title>
<meta name="description" content="Petits jeux en français pour apprendre et faire travailler sa tête.">
<meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11161f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Méninges">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icones/favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="meninges/commun/style.css">
<style>
  /* Accueil unique : les jeux (un dépôt chacun), puis l'entraînement express (exercices de meninges/). */
  .tete { display: flex; flex-direction: column; gap: 4px; padding-top: 8px; }
  .tete h1 { font-family: var(--f-display); font-weight: 800; font-size: 2.2rem; margin: 0; letter-spacing: -.02em; }
  .tete p { margin: 0; color: var(--muted); line-height: 1.5; }
  .rubrique { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-top: 6px; }
  .rubrique h2 { font-family: var(--f-display); font-size: 1.15rem; margin: 0; }
  .jour { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: .85rem; color: var(--muted); }
  .jour .points { display: flex; gap: 4px; }
  .jour .points i { width: 10px; height: 10px; border-radius: 50%; background: var(--key); display: block; }
  .jour .points i.fait { background: var(--c); }
  .liste { display: flex; flex-direction: column; gap: 10px; list-style: none; margin: 0; padding: 0; }
  .carte-jeu {
    display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 14px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px;
    text-decoration: none; color: var(--ink); touch-action: manipulation;
  }
  .carte-jeu:active { transform: scale(.99); }
  .carte-jeu .pastille { width: 52px; height: 52px; border-radius: 13px; background: var(--c); display: grid; place-items: center;
    color: #fff; font: 800 1.15rem var(--f-display); letter-spacing: -.02em; object-fit: cover; }
  .carte-jeu .txt { min-width: 0; }
  .carte-jeu strong { display: block; font-family: var(--f-display); font-size: 1.08rem; }
  .carte-jeu .resume { display: block; color: var(--muted); font-size: .88rem; line-height: 1.35; margin-top: 2px; }
  .carte-jeu .rec { text-align: right; font-size: .75rem; color: var(--muted); font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .carte-jeu .rec b { display: block; font-size: 1rem; color: var(--ink); }
  .carte-jeu .fait { color: var(--bon); font-size: .75rem; display: block; }
  .carte-jeu .fleche { font-size: 1.3rem; color: var(--muted); }
  .pied { color: var(--muted); font-size: .8rem; text-align: center; line-height: 1.5; margin: 6px 0 0; }
</style>
</head>
<body>
<div class="app">
  <header class="tete">
    <h1>Méninges</h1>
    <p>Mes petits jeux pour apprendre et faire travailler sa tête.</p>
  </header>

  <div class="rubrique"><h2>Jeux</h2></div>
  <ul class="liste" id="jeux"></ul>

  <div class="rubrique"><h2>Entraînement express</h2><div class="jour" id="jour"></div></div>
  <ul class="liste" id="exercices"></ul>

  <p class="pied">Tes scores restent dans ce téléphone.</p>
</div>
<script src="meninges/commun/commun.js"></script>
<script>
// Pour ajouter un jeu : une ligne ici (le jeu vit dans son propre dépôt GitHub, à l'adresse /nom-du-depot/).
const JEUX = [
  { nom: "Le Mot Juste", lien: "le-mot-juste/", icone: "le-mot-juste/icones/icone-192.png", texte: "Trouve le mot de 5 à 8 lettres en 6 essais, puis découvre sa définition." }
];
// Symboles des exercices d'entraînement (catalogue dans meninges/commun/commun.js)
const SYMBOLES = { "calcul-eclair": "×", "couleurs-piegees": "Aa", "memoire-mots": "≡", "maison-qui-compte": "⌂", "ordre-nombres": "123", "syllabes": "a·b", "lecture-rapide": "¶" };

const M = Meninges, e = M.echap;
document.getElementById("jeux").innerHTML = JEUX.map(j => `<li><a class="carte-jeu" href="${e(j.lien)}">
  <img class="pastille" src="${e(j.icone)}" alt="" width="52" height="52">
  <span class="txt"><strong>${e(j.nom)}</strong><span class="resume">${e(j.texte)}</span></span>
  <span class="fleche" aria-hidden="true">→</span></a></li>`).join("");

const auj = new Date().toISOString().slice(0, 10);
const faitAuj = slug => M.historique(slug).some(h => h.date === auj);
document.getElementById("exercices").innerHTML = M.EXERCICES.map(x => {
  const r = M.meilleur(x.slug);
  return `<li><a class="carte-jeu" href="meninges/exercices/${x.slug}/" style="--c:${x.couleur}">
    <span class="pastille" aria-hidden="true">${e(SYMBOLES[x.slug] || x.nom[0])}</span>
    <span class="txt"><strong>${e(x.nom)}</strong><span class="resume">${e(x.resume)}</span></span>
    <span class="rec">${r === null ? "à découvrir" : "record<b>" + e(M.formatScore(x.slug, r)) + "</b>"}${faitAuj(x.slug) ? '<span class="fait">✓ aujourd\'hui</span>' : ""}</span>
  </a></li>`;
}).join("");
const nb = M.EXERCICES.filter(x => faitAuj(x.slug)).length;
document.getElementById("jour").innerHTML = `<span>${nb} / ${M.EXERCICES.length}</span><span class="points">` +
  M.EXERCICES.map(x => `<i class="${faitAuj(x.slug) ? "fait" : ""}" style="--c:${x.couleur}"></i>`).join("") + "</span>";
</script>
</body>
</html>
