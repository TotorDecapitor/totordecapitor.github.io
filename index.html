<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes jeux</title>
<meta name="description" content="Petits jeux en français pour apprendre et faire travailler sa tête.">
<meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11161f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mes jeux">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icones/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Vitrine : une colonne, une carte par jeu avec son icône. Mêmes tons que les jeux. */
:root {
  --bg: #eef1f6; --surface: #ffffff; --ink: #18202f; --muted: #5b6578; --line: #c6cedb;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root { --bg: #11161f; --surface: #1b2230; --ink: #e9edf4; --muted: #9aa5b8; --line: #364055; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body);
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px)); }
main { max-width: 560px; margin: 0 auto; padding-block: 28px; display: flex; flex-direction: column; gap: 18px; }
h1 { font-family: var(--f-display); font-weight: 800; font-size: 2.3rem; margin: 0; letter-spacing: -.02em; }
.intro { color: var(--muted); margin: 0; line-height: 1.55; }
.jeux { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.jeu { display: grid; grid-template-columns: 72px 1fr; gap: 16px; align-items: center; background: var(--surface);
  border: 1px solid var(--line); border-radius: 18px; padding: 14px; text-decoration: none; color: var(--ink); }
.jeu:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.jeu img { width: 72px; height: 72px; border-radius: 16px; display: block; }
.jeu strong { font-family: var(--f-display); font-size: 1.25rem; display: block; }
.jeu span { color: var(--muted); font-size: .92rem; line-height: 1.45; display: block; margin-top: 3px; }
.astuce { color: var(--muted); font-size: .85rem; line-height: 1.5; margin: 0; }
</style>
</head>
<body>
<main>
  <h1>Mes jeux</h1>
  <p class="intro">Des petits jeux en français, pour jouer quelques minutes et apprendre quelque chose au passage.</p>
  <ul class="jeux" id="jeux"></ul>
  <p class="astuce">Sur iPhone : ouvre un jeu dans Safari, puis Partager → « Sur l'écran d'accueil » pour l'avoir comme une app.</p>
</main>
<script>
// Pour ajouter un jeu : une ligne ici (le jeu vit dans son propre dépôt GitHub).
const JEUX = [
  { nom: "Le Mot Juste", lien: "/le-mot-juste/", icone: "/le-mot-juste/icones/icone-192.png", texte: "Trouve le mot de 5 à 8 lettres en 6 essais, puis découvre sa définition." },
  { nom: "Méninges", lien: "/meninges/", icone: "/meninges/icones/icone-192.png", texte: "Sept petits exercices de calcul, mémoire, attention et lecture. Bats tes records." }
];
const e = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
document.getElementById("jeux").innerHTML = JEUX.map(j =>
  `<li><a class="jeu" href="${e(j.lien)}"><img src="${e(j.icone)}" alt="" width="72" height="72"><div><strong>${e(j.nom)}</strong><span>${e(j.texte)}</span></div></a></li>`
).join("");
</script>
</body>
</html>
